# IPM — local development services.
#
#   docker compose up -d
#
# This starts the PostgreSQL database IPM needs, so you do not have to install
# and configure PostgreSQL on your own machine. The application itself (the
# FastAPI backend and the Next.js frontend) runs directly on your machine with
# `scripts/dev.sh`, because that gives you instant reload when code changes.
#
# What each service is:
#
#   db      PostgreSQL — the application, governance and metadata database.
#           Holds users, projects, chats, analysis runs, traces, and the
#           Engine Builder / Data Builder definitions. It does NOT hold the
#           large monthly credit data; that lives in Parquet files under data/.
#
#   pgadmin A web page for browsing the database, if you ever want to look
#           inside it. Entirely optional — start it with:
#               docker compose --profile tools up -d
#           then open http://localhost:5050
#
# To stop everything:            docker compose down
# To stop AND erase the data:    docker compose down -v

name: ipm

services:
  db:
    image: postgres:16-alpine
    container_name: ipm-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ipm_app}
      # No default: an unset password should fail loudly here rather than
      # silently create a database you cannot connect to. Set it in .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env — copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:-ipm}
      # Deterministic collation, so ORDER BY behaves identically on every machine.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # Published so the backend running on your machine can reach it.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Compose waits for this before reporting the database as ready, so
      # scripts/dev.sh never tries to migrate a database that is still starting.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ipm_app} -d ${POSTGRES_DB:-ipm}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ipm-pgadmin
    profiles: ["tools"]  # only starts with: docker compose --profile tools up -d
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@ipm.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
