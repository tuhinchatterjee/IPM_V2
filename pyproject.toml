[project]
name = "ipm-tool"
version = "0.1.0"
description = "Intelligent Portfolio Manager — credit-risk & CBUAE regulatory reporting cockpit."
requires-python = ">=3.11"

# Exact pins captured from the working environment (2026-07). Bump deliberately,
# re-lock, and re-test — never float these, so every install is reproducible.
dependencies = [
    "dash==4.3.0",
    "dash-bootstrap-components==2.0.4",
    "plotly==6.8.0",
    "pandas==3.0.3",
    "openpyxl==3.1.5",
    # pandas' Parquet engine. Never imported by name, but
    # backend/services/data_store.py stores every dataset sheet via
    # df.to_parquet(), which fails at runtime without it.
    "pyarrow==24.0.0",
    # Imported directly (app.py: flask, data/compute modules: numpy) rather than
    # only reached through dash/pandas — declared so a clean install can't miss them.
    "flask==3.1.3",
    "numpy==2.5.0",
    # Retry/backoff around the AI backends (backend/services/ai_common.py).
    "tenacity==9.1.4",
    # Committee report packs: reportlab writes the PDF, python-docx the Word
    # file, and matplotlib renders the charts once as PNG so both formats show
    # the same picture. Pillow is reportlab's image backend.
    "reportlab==5.0.0",
    "python-docx==1.2.0",
    # A committee reads slides in the room and the pack afterwards. Declared
    # rather than optional: a Playbook export that silently omitted the format
    # a chair actually presents from would be a missing feature dressed as a
    # configuration difference.
    "python-pptx==1.0.2",
    "matplotlib==3.11.0",
    "pillow==12.2.0",
    "requests==2.34.2",
    "anthropic==0.112.0",
    "python-dotenv==1.2.2",
    "waitress==3.0.2",
    "flask-compress==1.24",
    "sqlalchemy==2.0.51",
    "alembic==1.18.5",
    "psycopg[binary]==3.3.4",
    "flask-login==0.6.3",
    "argon2-cffi==25.1.0",
    # ---- Phase 1: the API and the analytical store ----
    # FastAPI serves every capability to the Next.js frontend; Pydantic defines
    # the response contracts the TypeScript client mirrors.
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    # DuckDB queries the Parquet analytics layer. Imported ONLY by
    # backend/data_access/duckdb_source.py — see docs/ARCHITECTURE.md §3.
    "duckdb==1.5.5",
    # ---- Part G: regulatory circular ingestion ----
    # pypdf reads page text and page counts out of a circular PDF. Pure Python
    # and no system libraries, so the image builds the same way everywhere. A
    # scanned page yields no text and is marked NEEDS_OCR rather than stored
    # as empty — backend/regulatory/extract.py refuses to pretend.
    "pypdf==6.4.0",
]

[dependency-groups]
# Dev-only tooling, excluded from prod installs. Lower bounds here; the exact
# resolved versions are captured in requirements-dev.txt. Additional runtime
# deps are added per upgrade phase.
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    # FastAPI's TestClient needs httpx.
    "httpx>=0.27",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Line length is left to judgment rather than the linter — several tool-schema and
# f-string literals are legitimately long. Every other E/F/I/UP/B check stays on.
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection API is *designed* around calls in argument
# defaults — Depends(), Query(), File() and Form() are how a route declares what
# it needs. Ruff supports declaring them as immutable so B008 stops flagging the
# framework's own idiom, which is better than suppressing the rule wholesale.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.File",
    "fastapi.Form",
]

[tool.ruff.lint.isort]
# `app` and `frontend` are the preserved Dash application's modules
# (legacy/dash_app/), which its test suites import directly.
known-first-party = ["backend", "frontend", "app"]

[tool.ruff.lint.per-file-ignores]
# app.py deliberately calls init_logging() before importing local modules.
"legacy/dash_app/app.py" = ["E402"]
# Alembic writes these files; keeping them close to what it generates makes the
# next autogenerated migration a clean diff rather than a reformatting exercise.
"alembic/versions/*.py" = ["UP035", "UP007", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
# Put the project root on sys.path so `backend`/`frontend` import under any runner.
pythonpath = ["."]
